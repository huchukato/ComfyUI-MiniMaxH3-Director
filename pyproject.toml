[project]
name = "minimaxh3-director-enhanced"
description = "A timeline editor for MiniMax H3 — storyboard prompts, first/last keyframes, image/video/audio references, native joint audio, live sampling preview, retakes and shot chaining."
version = "0.3.9"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Nothing beyond what ComfyUI itself already installs.
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/huchukato/ComfyUI-MiniMaxH3-Director-Enhanced"
"Bug Tracker" = "https://github.com/huchukato/ComfyUI-MiniMaxH3-Director-Enhanced/issues"

[tool.comfy]
# Must match the publisher you create at https://registry.comfy.org
PublisherId = "huchukato"
DisplayName = "MiniMax H3 Director Enhanced"
Icon = "https://raw.githubusercontent.com/huchukato/ComfyUI-MiniMaxH3-Director-Enhanced/main/icon.png"
Banner = "https://raw.githubusercontent.com/huchukato/ComfyUI-MiniMaxH3-Director-Enhanced/main/banner.png"
# comfy_api.latest, the packed AV latent and H3 support all landed in ComfyUI 0.30.0.
requires-comfyui = ">=0.30.0"
