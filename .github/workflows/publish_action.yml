name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

# `write` is for the tag and the release created after a successful publish. The publish
# step itself only reads.
permissions:
  contents: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'huchukato' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read the version
        id: ver
        run: |
          # plain POSIX sed rather than grep -oP: \K needs PCRE, which is not everywhere
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          if [ -z "$version" ]; then
            echo "no version in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version is $version"

      - name: Extract changelog
        run: |
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "no version in pyproject.toml" >&2
            exit 1
          fi
          awk -v ver="## $VERSION" '
            $0 ~ "^"ver"($| )" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > changelog.txt
          [ -s changelog.txt ] || git log -1 --pretty=%B > changelog.txt

      - name: Publish Custom Node
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          pip install comfy-cli
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_TOKEN" --changelog-file changelog.txt

      # Only after the registry accepted it, so a failed publish leaves no tag claiming
      # a version that was never released. Existing tags are left alone rather than moved:
      # a tag that shifts under people is worse than a missing one.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists, leaving it alone."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$VERSION"
          git push origin "$tag"

          # Release notes come from the CHANGELOG section for this version, so there is
          # only ever one place the history is written. No section, no notes — not a
          # reason to fail the run.
          notes=$(awk -v v="## $VERSION" '
            $0 ~ "^"v"($| )" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" > /tmp/notes.md
            gh release create "$tag" --title "$VERSION" --notes-file /tmp/notes.md --latest
          else
            echo "No CHANGELOG section for $VERSION — releasing without notes."
            gh release create "$tag" --title "$VERSION" --notes "" --latest
          fi
